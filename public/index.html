<style>
/* Layout idea: one column; every screen leads with a picture of the state (ring, rail, grid, dots) and keeps words to labels. */
:root{
  --bg:#eef2ee; --surface:#ffffff; --ink:#13201b; --muted:#5b6a63; --line:#d5ddd7;
  --accent:#0d7355; --accent-ink:#ffffff; --accent-soft:#dcefe7;
  --warn:#b4540a; --warn-soft:#fbead6; --bad:#b3261e; --protein:#2f6fb0;
  --display:"Bricolage Grotesque","Avenir Next Condensed","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1513; --surface:#17211e; --ink:#e7eeea; --muted:#94a39b; --line:#2a3833;
    --accent:#45cc9d; --accent-ink:#06231a; --accent-soft:#1b3a30;
    --warn:#f0a35a; --warn-soft:#3a2a17; --bad:#ff8a80; --protein:#7fb4ee; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#17211e; --ink:#e7eeea; --muted:#94a39b; --line:#2a3833;
  --accent:#45cc9d; --accent-ink:#06231a; --accent-soft:#1b3a30;
  --warn:#f0a35a; --warn-soft:#3a2a17; --bad:#ff8a80; --protein:#7fb4ee; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:620px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:28px;font-weight:700} h2{font-size:20px;font-weight:700} h3{font-size:16px;font-weight:700}
p{margin:0} .muted{color:var(--muted)} .small{font-size:14px} .num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .spread{justify-content:space-between} .grow{flex:1 1 0;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent} .btn.danger{color:var(--bad)} .btn.big{flex:1 1 auto;font-size:17px}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sync{font-size:12px;color:var(--muted)}
/* hero */
.hero{flex-direction:row;align-items:center;gap:16px}
.ring text{font-family:var(--display);font-weight:700;fill:var(--ink)}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter .lab b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.p i{background:var(--protein)}
/* day rail */
.rail{display:grid;grid-template-columns:repeat(5,1fr);position:relative;padding:4px 0}
.rail:before{content:"";position:absolute;left:10%;right:10%;top:26px;height:3px;background:var(--line);border-radius:3px}
.stop{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;font-size:12px;color:var(--muted);text-align:center}
.stop .dot{width:44px;height:44px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font-size:20px}
.stop.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:700}
.stop.next .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stop.next{color:var(--ink);font-weight:600}
/* meals */
.meal{border-left:5px solid var(--line)} .meal.next{border-left-color:var(--accent)} .meal.done{opacity:.6}
.slotic{font-size:30px;line-height:1}
.time{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;display:block;line-height:1}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 11px 5px 7px;font-size:14px}
.chip .e{font-size:18px;line-height:1}
button.chip{cursor:pointer;min-height:42px;font:inherit;font-size:14px;color:inherit}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:46px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.err{color:var(--bad);font-size:14px}
.row.three label.f{flex:1 1 90px}
.lift{flex:0 0 120px}
.tag{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.tag b{color:var(--ink)}
details summary{cursor:pointer;font-size:14px;color:var(--accent);font-weight:600;min-height:32px;display:flex;align-items:center}
details p{font-size:14px;color:var(--muted);padding-top:4px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
.tile .e{font-size:26px;line-height:1.1} .tile b{font-family:var(--display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.drops{display:flex;gap:6px}
.drop{border:0;background:none;font-size:30px;padding:4px;min-width:46px;min-height:46px;opacity:.25;filter:grayscale(1)}
.drop.on{opacity:1;filter:none}
.toggle{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;min-height:52px;font-weight:600;width:100%;text-align:left}
.toggle.on{border-color:var(--accent);background:var(--accent-soft)}
.note{background:var(--warn-soft);border-radius:14px;padding:12px 14px;border:1px solid var(--line);display:flex;gap:10px;align-items:center}
.note .e{font-size:24px}
/* segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--muted);min-height:40px}
.seg button.on{background:var(--surface);color:var(--ink)}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);min-height:64px}
.strip button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.strip button.today b{color:var(--accent)}
.pips{display:flex;gap:2px} .pips i{width:6px;height:6px;border-radius:50%;background:var(--line)} .pips i.on{background:var(--accent)}
.prow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)} .prow:last-child{border-bottom:0}
.prow .e{font-size:24px} .prow .ings{font-size:18px;letter-spacing:2px}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ol.steps li{display:flex;gap:12px;align-items:flex-start;font-size:14px} ol.steps .e{font-size:24px;line-height:1.1}
.chk{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.chk .e{font-size:20px} .chk.on span.t{text-decoration:line-through;color:var(--muted)}
/* train */
.ex h3{font-size:18px}
.reps{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sets{display:flex;gap:8px}
.set{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.set.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
ul.cues{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:2px}
a{color:var(--accent)} a.demo{font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:36px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dh{text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;min-width:0}
.cell.l1{background:var(--accent-soft)}
.cell.l2{background:var(--accent-soft);background:color-mix(in srgb,var(--accent) 35%,var(--surface))}
.cell.l3{background:var(--accent);background:color-mix(in srgb,var(--accent) 65%,var(--surface));color:var(--accent-ink)}
.cell.l4{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cell.fut{opacity:.35} .cell.tod{outline:2px solid var(--ink);outline-offset:1px} .cell.sel{box-shadow:0 0 0 3px var(--warn)}
.cell .mk{font-size:8px;line-height:1;height:8px;letter-spacing:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);vertical-align:-2px;margin-right:3px}
.wk{display:flex;gap:4px;justify-content:center} .wk i{width:10px;height:10px;border-radius:50%;background:var(--line)} .wk i.on{background:var(--accent)}
/* forms */
.card>label.f{flex:0 0 auto}
label.f{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px;flex:1 1 130px}
input[type=number],input[type=date],input[type=time],input[type=password],input[type=text],input[type=url]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:46px;width:100%}
textarea{font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:90px}
textarea.plain{font:inherit;min-height:110px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
a.btn.primary{color:var(--accent-ink)}
svg text{font-family:var(--body);font-size:11px;fill:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav a{padding:8px 2px 10px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:3px solid transparent;margin-top:-1px}
nav a svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--accent);border-top-color:var(--accent)}
@media (max-width:380px){.tiles{grid-template-columns:repeat(2,1fr)}.set{width:42px;height:42px}}
@media (prefers-reduced-motion: no-preference){.bar i{transition:width .3s}}

function streaks(){
  var t=new Date(),d=hit(key(t))?t:addDays(t,-1),cur=0;
  while(hit(key(d))){cur++;d=addDays(d,-1);}
  var ks=Object.keys(S.done).filter(hit).sort(),best=0,run=0,prev=null;
  ks.forEach(function(k){run=(prev&&key(addDays(parseKey(prev),1))===k)?run+1:1;if(run>best)best=run;prev=k;});
  var mon=addDays(t,-dow(t)),wk=[];for(var i=0;i<7;i++)wk.push(hit(key(addDays(mon,i))));

  if(a==="calsel"){calSel=b.dataset.k;render();return;}
  if(a==="calnav"){var t0=new Date(),m=calMonth||new Date(t0.getFullYear(),t0.getMonth(),1);calMonth=new Date(m.getFullYear(),m.getMonth()+(+b.dataset.d),1);render();return;}
  if(a==="done"){S.done[k]=S.done[k]||{};if(S.done[k][b.dataset.id])delete S.done[k][b.dataset.id];else S.done[k][b.dataset.id]=1;}
  else if(a==="pick"){var pn=b.dataset.n;S.swaps[k]=S.swaps[k]||{};S.swaps[k][b.dataset.id]=/^c:/.test(pn)?pn:+pn;swapOpen=null;}
  else if(a==="caldone"){var ck=b.dataset.k;S.done[ck]=S.done[ck]||{};if(S.done[ck][b.dataset.id])delete S.done[ck][b.dataset.id];else S.done[ck][b.dataset.id]=1;}
  else if(a==="caltrain"){if(S.train[b.dataset.k])delete S.train[b.dataset.k];else S.train[b.dataset.k]=1;}
  else if(a==="calwater"){S.water[b.dataset.k]=((S.water[b.dataset.k]||0)+1)%6;}
  else if(a==="water"){var wn=+b.dataset.n;S.water[k]=(S.water[k]===wn)?wn-1:wn;}
  else if(a==="train"){if(S.train[k])delete S.train[k];else S.train[k]=1;}
  else if(a==="set"){var w=S.workouts[k]||(S.workouts[k]={d:todayWorkout().d,sets:{}}),si=b.dataset.i,sn=+b.dataset.n;w.sets[si]=(w.sets[si]===sn)?sn-1:sn;}
  else if(a==="finish"){var w2=S.workouts[k]||(S.workouts[k]={d:todayWorkout().d,sets:{}});if(w2.fin){delete w2.fin;delete S.train[k];}else{var W2=WORKOUTS[w2.d],tt=0,gg=0;W2.ex.forEach(function(x,i){tt+=x.s;gg+=Math.min(x.s,w2.sets[i]||0);});
      if(gg<tt/2&&!finArmed){finArmed=true;render();return;}finArmed=false;w2.fin=1;S.train[k]=1;}}
  else if(a==="logw"){var v=parseFloat(document.getElementById(b.dataset.src).value),dEl=document.getElementById("wd"),dk=dEl&&dEl.value?dEl.value:k;if(!(v>=100&&v<=400)){wErr="Enter a weight between 100 and 400 lb.";if(b.dataset.src==="wq")render();else{var le=document.getElementById("wverr");if(le)le.textContent=wErr;}return;}wErr="";editW=false;S.weights[dk]=Math.round(v*10)/10;}
  else if(a==="delw"){delete S.weights[b.dataset.k];}
  else if(a==="adjust"){S.settings.adjust=(+S.settings.adjust||0)+(+b.dataset.delta);}
  else if(a==="shopreset"){S.shop={};}
  else if(a==="saveset"){var s=S.settings,ok=true;["start","goal","height","age"].forEach(function(f){var v=parseFloat(document.getElementById("f_"+f).value);if(v>0)s[f]=v;else ok=false;});
    ["wake","bed"].forEach(function(f){var v=document.getElementById("f_"+f).value;if(/^\d\d:\d\d/.test(v))s[f]=v.slice(0,5);else ok=false;});
    var mg2=minGoal(s.height),note="";if(s.age<18){s.age=18;note=" This plan is for adults, so age was set to 18.";}if(s.goal<mg2){s.goal=Math.ceil(mg2);note+=" Goal raised to "+s.goal+" lb, the lowest healthy weight for your height.";}
    if(s.goal>s.start&&s.goal>maxGoal(s.height)){s.goal=Math.floor(maxGoal(s.height));note+=" Goal lowered to "+s.goal+" lb, the top of a healthy range for your height.";}
    save();render();document.getElementById("setmsg").textContent=(ok?"Saved. Plates and times are updated.":"Some fields were empty and kept their old values.")+note;return;}
  else if(a==="savekey"){syncKey=document.getElementById("f_key").value.trim();try{localStorage.setItem(SK,syncKey);}catch(err){}setSync(syncKey?"offline":"device");render();pull();return;}
  else if(a==="copyb"){var mm=document.getElementById("bkmsg"),tx=document.getElementById("bk").value;if(navigator.clipboard)navigator.clipboard.writeText(tx).then(function(){mm.textContent="Copied.";},function(){mm.textContent="Could not copy. Select the text and copy it by hand.";});return;}
  else if(a==="importb"){try{var o=JSON.parse(document.getElementById("bk").value);if(!o||typeof o!=="object"||!o.settings)throw 0;S=merge(o);}catch(err){document.getElementById("bkmsg").textContent="That is not a valid backup. Nothing was changed.";return;}}
  else if(a==="reset"){if(!resetArmed){resetArmed=true;b.textContent="Tap again to erase everything";return;}resetArmed=false;var keep=S.settings;S=JSON.parse(JSON.stringify(DEF));S.settings=keep;S.settings.adjust=0;}
  save();render();
});
document.addEventListener("change",function(e){
  var b=e.target;if(!b.dataset)return;
  if(b.dataset.act==="lift"){var lv=parseFloat(b.value);if(lv>0)S.lifts[b.dataset.n]=lv;else delete S.lifts[b.dataset.n];save();return;}
  if(b.dataset.act!=="shop")return;
  if(b.checked)S.shop[b.id]=1;else delete S.shop[b.id];save();render();
});
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0);});
render();
whoami().then(pull);
</script>
